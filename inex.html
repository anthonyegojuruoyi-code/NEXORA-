<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>NEXORA</title>
<style>
:root{--bg:#050816;--cd:#0d1330;--ln:#1e2a55;--tx:#e8ecff;--mu:#7f8ab8;--up:#19d38a;--dn:#ff4d6d;--ac:#3b82ff;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--tx);font:15px system-ui,sans-serif;min-height:100%}
#app{max-width:520px;margin:auto;min-height:100vh;padding:14px 14px 80px}
h2{margin:6px 0 12px;font-size:19px}.c{background:var(--cd);border:1px solid var(--ln);border-radius:14px;padding:12px;margin-bottom:10px}
input,select{width:100%;padding:12px;margin:5px 0;border-radius:10px;border:1px solid var(--ln);background:#080d26;color:var(--tx);font-size:15px}
button{background:var(--ac);color:#fff;border:0;border-radius:10px;padding:11px 14px;font-size:15px;cursor:pointer}
button.g{background:transparent;border:1px solid var(--ln);color:var(--tx)}button.u{background:var(--up);color:#032}button.d{background:var(--dn)}
.r{display:flex;justify-content:space-between;align-items:center;gap:8px}.mu{color:var(--mu);font-size:13px}.up{color:var(--up)}.dn{color:var(--dn)}
.row{padding:11px 4px;border-bottom:1px solid var(--ln)}.row:last-child{border:0}
nav{position:fixed;bottom:0;left:0;right:0;background:#070c24;border-top:1px solid var(--ln);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px)}
nav div{display:flex;width:100%;max-width:520px}nav button{flex:1;background:none;color:var(--mu);border-radius:0;padding:13px 2px;font-size:12px}nav button.on{color:var(--ac)}
canvas{width:100%;height:280px;background:#080d26;border-radius:12px;touch-action:none}
.ctr{text-align:center}.logo{width:150px;border-radius:30px;margin:40px auto 20px;display:block}
.msg{padding:6px 0}.msg b{color:var(--ac)}.t{overflow-x:auto}table{width:100%;font-size:13px;border-collapse:collapse}td,th{padding:6px;text-align:left;border-bottom:1px solid var(--ln);white-space:nowrap}
</style></head><body><div id="app"></div>

const P={},C={},O={};

const px=k=>k=='NSI'?NSI():AS[k][1]*(1+(S.mk[k]||0)/LQ);
for(const k in AS){O[k]=AS[k][1];P[k]=px(k);C[k]=[];for(let i=0;i<120;i++)C[k].push({o:P[k],c:P[k],h:P[k],l:P[k]})}
S.chat=S.chat.filter(m=>m.n!='Ada_K'&&m.n!='Tunde');S.users.forEach(u=>{for(const k in u.h)if(!AS[k])delete u.h[k]});
const fm=v=>{const[r,s]=RATE[S.cur];return s+(v*r).toLocaleString(undefined,{maximumFractionDigits:v*r<10?3:2})};
const me=()=>S.users.find(u=>u.id==S.me);
const nw=u=>u.cash+Object.entries(u.h).reduce((a,[k,q])=>a+q*P[k],0);
let tab='mk',sel='ECM',zoom=60,tick=0,unlocked=false;
function splash(){A.innerHTML=`<div class="ctr"><img class="logo" src="${LOGO}"><h2>WELCOME to NEXORA Platform</h2><p class="mu" style="position:fixed;left:0;right:0;bottom:calc(32px + env(safe-area-inset-bottom,0px))">powered by VELTEX</p></div>`;setTimeout(()=>S.me&&me()?(me().pass?lock():main()):auth('in'),2200)}
function auth(m){A.innerHTML=`<img class="logo" style="width:80px;margin:10px auto" src="${LOGO}"><div class="r" style="margin-bottom:8px"><button class="${m=='in'?'':'g'}" style="flex:1" onclick="auth('in')">Sign in</button><button class="${m=='up'?'':'g'}" style="flex:1" onclick="auth('up')">Sign up</button></div><div class="c"><input id="e" type="email" placeholder="Email">${m=='up'?'<input id="n" placeholder="Full name"><input id="p" type="tel" placeholder="Phone number"><input id="a" placeholder="Address">':''}<input id="w" type="password" placeholder="Password"><button style="width:100%;margin-top:6px" onclick="${m=='in'?'login()':'signup()'}">${m=='in'?'Sign in':'Create account'}</button><p id="er" class="dn"></p><button class="g" style="width:100%" onclick="google()">Continue with Google</button></div>`}
const er=t=>$('#er').textContent=t;
function signup(){const e=$('#e').value.trim().toLowerCase(),w=$('#w').value;if(!/^\S+@\S+\.\S+$/.test(e)||w.length<6||!$('#n').value||!$('#p').value||!$('#a').value)return er('Fill every field (password 6+ chars)');if(S.users.some(u=>u.email==e))return er('Email already registered');mk({email:e,pw:w,name:$('#n').value,phone:$('#p').value,addr:$('#a').value})}
function mk(o){const u={id:Date.now(),cash:50000,h:{},joined:new Date().toLocaleDateString(),...o};S.users.push(u);S.me=u.id;save();setup()}
function login(){const u=S.users.find(u=>u.email==$('#e').value.trim().toLowerCase()&&u.pw==$('#w').value);if(!u)return er('Wrong email or password');S.me=u.id;save();u.pass?lock():main()}
function google(){const e=(prompt('Enter your Gmail address')||'').trim().toLowerCase();if(!/^\S+@gmail\.com$/.test(e))return;const u=S.users.find(u=>u.email==e);if(u){S.me=u.id;save();return main()}mk({email:e,pw:'',name:e.split('@')[0],phone:'',addr:'',google:1})}
function setup(){A.innerHTML=`<h2>Secure your portfolio</h2><div class="c"><p class="mu">Set a 4-digit passcode</p><input id="pc" type="password" inputmode="numeric" maxlength="4" placeholder="Passcode"><button class="g" style="width:100%" onclick="bio('Fingerprint')">Enable fingerprint</button><br><br><button class="g" style="width:100%" onclick="bio('Face match')">Enable face match</button><p id="er" class="mu"></p><button style="width:100%" onclick="fin()">Continue</button></div>`}
async function bio(n){try{await navigator.credentials.create({publicKey:{challenge:crypto.getRandomValues(new Uint8Array(32)),rp:{name:'NEXORA'},user:{id:new Uint8Array(8),name:me().email,displayName:me().name},pubKeyCredParams:[{type:'public-key',alg:-7}],authenticatorSelection:{authenticatorAttachment:'platform',userVerification:'required'}}});me()[n]=1;save();er(n+' enabled')}catch(e){er(n+' needs a device with biometrics and a secure (HTTPS) page; it was not enabled')}}
function fin(){const p=$('#pc').value;if(p&&!/^\d{4}$/.test(p))return er('Passcode must be 4 digits');if(p)me().pass=p;save();main()}
function lock(){A.innerHTML=`<div class="ctr"><img class="logo" style="width:90px;margin-top:80px" src="${LOGO}"><h2>Enter passcode</h2><input id="pc" type="password" inputmode="numeric" maxlength="4" style="text-align:center;max-width:200px" oninput="if(this.value==me().pass){main()}"></div>`}
function main(){unlocked=true;draw0()}
function draw0(){const u=me();const T=[['mk','Markets'],['tr','Trade'],['lv','Live'],['pf','Portfolio'],['st','Settings']];
A.innerHTML=`<div id="v"></div><nav><div>${T.map(t=>`<button class="${tab==t[0]?'on':''}" onclick="tab='${t[0]}';draw0()">${t[1]}</button>`).join('')}</div></nav>`;view()}
function view(){const u=me(),v=$('#v');if(!v)return;
if(tab=='mk')v.innerHTML=`<div class="r"><h2>Markets</h2><select style="width:90px" onchange="S.cur=this.value;save();view()">${Object.keys(RATE).map(c=>`<option ${c==S.cur?'selected':''}>${c}</option>`).join('')}</select></div><div class="c">${Object.keys(AS).map(k=>{const ch=(P[k]/O[k]-1)*100;return`<div class="row r" onclick="sel='${k}';tab='tr';draw0()"><div><b>${k}</b> <span class="mu">${AS[k][0]}</span></div><div style="text-align:right">${fm(P[k])}<br><span class="${ch>=0?'up':'dn'}">${ch>=0?'+':''}${ch.toFixed(2)}%</span></div></div>`}).join('')}</div><p class="mu">Practice market: prices move on their own (simulated) and also when traders buy or sell. Virtual cash only. NSI is the average of all markets.</p>`;
else if(tab=='tr'){v.innerHTML=`<div class="r"><select style="width:140px" onchange="sel=this.value;view()">${Object.keys(AS).map(k=>`<option ${k==sel?'selected':''}>${k}</option>`).join('')}</select><h2 id="pr">${fm(P[sel])}</h2></div><canvas id="cv"></canvas><div class="r" style="margin:8px 0"><button class="g" onclick="zoom=Math.max(15,zoom-10);dr()">＋ Zoom</button><button class="g" onclick="zoom=Math.min(120,zoom+10);dr()">－ Zoom</button></div><div class="c"><div class="mu">Cash ${fm(u.cash)} · Holding ${(u.h[sel]||0).toFixed(4)} ${sel}</div><input id="am" type="number" placeholder="Amount in USD"><div class="r"><button class="u" style="flex:1" onclick="trade(1)">Buy</button><button class="d" style="flex:1" onclick="trade(-1)">Sell</button></div><p id="er" class="mu"></p></div><div class="c"><b>Practice prediction</b><p class="mu">Practice only. Uses virtual cash, no real money.</p><div class="r"><span class="mu">Practice price</span><b id="pl">${fm(pp(sel))}</b></div><input id="sk" type="number" placeholder="Stake in USD"><select id="du"><option value="15">15 seconds</option><option value="30">30 seconds</option><option value="60">60 seconds</option></select><div class="r"><button class="u" style="flex:1" onclick="pred(1)">Up</button><button class="d" style="flex:1" onclick="pred(-1)">Down</button></div><p id="pm" class="mu"></p></div>`;const cv=$('#cv');cv.onwheel=e=>{e.preventDefault();zoom=Math.max(15,Math.min(120,zoom+(e.deltaY>0?6:-6)));dr()};let d0=0;cv.ontouchmove=e=>{if(e.touches.length==2){const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);if(d0)zoom=Math.max(15,Math.min(120,zoom*d0/d));d0=d;dr()}};cv.ontouchend=()=>d0=0;dr()}
else if(tab=='lv'){const L=S.users.map(x=>[x.name,nw(x)]).sort((a,b)=>b[1]-a[1]).slice(0,10);
v.innerHTML=`<h2>Richest traders</h2><div class="c">${L.map((x,i)=>`<div class="row r"><span>${i+1}. ${x[0]}</span><b>${fm(x[1])}</b></div>`).join('')}</div><h2>Live room</h2><div class="c" style="max-height:260px;overflow:auto">${S.chat.map(m=>`<div class="msg"><b>${m.n}</b> ${m.t.replace(/</g,'&lt;')}</div>`).join('')}</div><div class="r"><input id="ms" placeholder="Message everyone"><button onclick="say()">Send</button></div><p class="mu">Public chat only. No private messages. In this practice version, chat and the leaderboard live on this phone only.</p>`}
else if(tab=='pf')v.innerHTML=`<h2>${u.name}</h2><div class="c"><div class="mu">Net worth</div><h2>${fm(nw(u))}</h2><div class="mu">Cash ${fm(u.cash)}</div></div><div class="c">${Object.entries(u.h).filter(x=>x[1]>0).map(([k,q])=>`<div class="row r"><span>${k}</span><span>${q.toFixed(4)} · ${fm(q*P[k])}</span></div>`).join('')||'<span class="mu">No holdings yet</span>'}</div>`;
else st(v)}
function st(v){const u=me();v.innerHTML=`<h2>Settings</h2><div class="c"><b>⭐ NEXORA Premium</b><p class="mu">₦1,500 / month. Gold star badge, no ads and longer price history on live markets.</p><button style="width:100%" onclick="alert('Premium payments work on the hosted server version of NEXORA (nexora-app.js). They are not available in this practice page.')">Go Premium: ₦1,500 / month</button></div><div class="c"><b>Deposit</b><p class="mu">Minimum 100, maximum 1,000,000</p><input id="dp" type="number" placeholder="Amount"><button style="width:100%" onclick="dep()">Deposit with Paystack</button><p id="er" class="mu"></p></div><div class="c"><b>Withdraw</b><input id="wd" type="number" placeholder="Amount"><button class="g" style="width:100%" onclick="er('Practice version: withdrawals are off.')">Request withdrawal</button></div>`+[['Terms and conditions','By using NEXORA you agree to trade at your own risk, provide accurate information, and follow the platform rules. Markets can lose value. NEXORA is operated by VELTEX.'],['Privacy','We store your name, email, phone and address to run your account. We do not share them without your consent, except where the law requires.'],['Rules and regulations','No market manipulation, no abuse in the live room, one account per person, and no private messaging. Violations can lead to suspension.'],['Report a problem','']].map(x=>`<div class="c"><b onclick="this.nextElementSibling.hidden^=1" style="cursor:pointer">${x[0]} ›</b><div hidden class="mu" style="margin-top:8px">${x[1]||'<input id="rp" placeholder="Describe the problem"><button onclick="rep()">Send report</button>'}</div></div>`).join('')+`<button class="g" style="width:100%;margin-bottom:8px" onclick="adm()">Admin login</button><button class="g" style="width:100%" onclick="S.me=null;save();auth('in')">Log out</button>`}
function dep(){const a=+$('#dp').value;if(!(a>=100&&a<=1000000))return er('Enter an amount from 100 to 1,000,000');er('Practice version: deposits are off. You trade with virtual money.')}
function rep(){const t=$('#rp').value.trim();if(!t)return;(S.reports=S.reports||[]).push({u:me().email,t});save();$('#rp').value='';alert('Report sent')}
function say(){const t=$('#ms').value.trim();if(!t)return;S.chat.push({n:me().name,t:t.slice(0,200)});S.chat=S.chat.slice(-60);save();view()}
function trade(s){const u=me(),a=+$('#am').value;if(sel=='NSI')return er('NSI is an index and cannot be traded');if(!(a>0))return er('Enter an amount in USD');const n=S.mk[sel]||0,b=AS[sel][1],pa=b*(1+(n+s*a)/LQ);if(pa<b*.05)return er('Amount too large');const q=a/((P[sel]+pa)/2);if(s>0){if(a>u.cash)return er('Not enough cash');u.cash-=a;u.h[sel]=(u.h[sel]||0)+q}else{if(q>(u.h[sel]||0)+1e-9)return er('Not enough '+sel);u.h[sel]-=q;u.cash+=a}S.mk[sel]=n+s*a;P[sel]=px(sel);save();view()}
const WK={};const pp=k=>P[k];
function pred(s){const u=me(),a=+$('#sk').value,d=+$('#du').value,k=sel,m=$('#pm');if(k=='NSI'){m.textContent='Pick a tradable market';return}if(!(a>0&&a<=u.cash)){m.textContent='Enter a stake within your cash';return}const e=pp(k);u.cash-=a;save();m.textContent='Entry '+fm(e)+', result in '+d+'s...';setTimeout(()=>{const x=pp(k);let r;if(x==e){u.cash+=a;r='Tie, stake returned'}else if((x-e)*s>0){u.cash+=a*1.8;r='You won '+fm(a*.8)}else r='You lost '+fm(a);save();const p=$('#pm');if(p)p.textContent=r},d*1000)}
function adm(){let p=S.admin;const x=prompt(p?'Admin password':'Create an admin password');if(!x)return;if(!p){S.admin=x;save()}else if(x!=p)return alert('Wrong password');
$('#v').innerHTML=`<h2>Admin: users (${S.users.length})</h2><div class="c t"><table><tr><th>Name</th><th>Email</th><th>Phone</th><th>Address</th><th>Net worth</th><th>Joined</th></tr>${S.users.map(u=>`<tr><td>${u.name}</td><td>${u.email}</td><td>${u.phone}</td><td>${u.addr}</td><td>${fm(nw(u))}</td><td>${u.joined}</td></tr>`).join('')}</table></div><h2>Reports</h2><div class="c">${(S.reports||[]).map(r=>`<div class="row"><b>${r.u}</b> ${r.t.replace(/</g,'&lt;')}</div>`).join('')||'<span class="mu">None</span>'}</div><button class="g" onclick="view()">Back</button>`}
function dr(){const cv=$('#cv');if(!cv)return;const w=cv.clientWidth,h=cv.clientHeight,dp=devicePixelRatio||1;cv.width=w*dp;cv.height=h*dp;const g=cv.getContext('2d');g.scale(dp,dp);const d=C[sel].slice(-Math.round(zoom));let hi=Math.max(...d.map(x=>x.h)),lo=Math.min(...d.map(x=>x.l));const pad=Math.max((hi-lo)*.08,hi*.01);hi+=pad;lo-=pad;const Y=v=>h-18-(v-lo)/(hi-lo)*(h-30),bw=(w-50)/d.length;g.font='10px sans-serif';g.fillStyle='#7f8ab8';g.strokeStyle='#1e2a55';for(let i=0;i<5;i++){const v=lo+(hi-lo)*i/4,y=Y(v);g.beginPath();g.moveTo(0,y);g.lineTo(w-48,y);g.stroke();g.fillText((v*RATE[S.cur][0]).toLocaleString(undefined,{maximumFractionDigits:v<10?3:0}),w-46,y+3)}d.forEach((c,i)=>{const x=i*bw+bw/2,up=c.c>=c.o;g.strokeStyle=g.fillStyle=up?'#19d38a':'#ff4d6d';g.beginPath();g.moveTo(x,Y(c.h));g.lineTo(x,Y(c.l));g.stroke();g.fillRect(x-bw*.35,Math.min(Y(c.o),Y(c.c)),bw*.7,Math.max(1,Math.abs(Y(c.o)-Y(c.c))))});const y=Y(P[sel]);g.setLineDash([4,3]);g.strokeStyle='#3b82ff';g.beginPath();g.moveTo(0,y);g.lineTo(w-48,y);g.stroke();g.setLineDash([])}
setInterval(()=>{tick++;for(const k in AS){const c=C[k][C[k].length-1];WK[k]=Math.max(-.08,Math.min(.08,(WK[k]||0)+(Math.random()-.5)*.01));const p=k=='NSI'?px(k):px(k)*(1+WK[k]);c.c=p;c.h=Math.max(c.h,p);c.l=Math.min(c.l,p);P[k]=p;if(tick%8==0)C[k].push({o:p,c:p,h:p,l:p}),C[k].length>300&&C[k].shift()}if(unlocked&&S.me){if(tab=='tr'){dr();const e=$('#pr');if(e)e.textContent=fm(P[sel]);const q=$('#pl');if(q)q.textContent=fm(pp(sel))}else if(tab=='mk'&&tick%3==0&&!document.activeElement.matches('select'))view()}},1500);
splash();
</script></body></html>
